<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gradiente de Fondo Oscuro Fintech -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Gradiente Borde Neón Esmeralda & Oro -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Gradiente Símbolo del Dólar 3D -->
    <linearGradient id="dollarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="25%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Gradiente Flecha de Crecimiento -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Filtros de Brillo Neón -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Fondo Principal (Squircle / Avatar de Telegram) -->
  <rect x="25" y="25" width="750" height="750" rx="190" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" filter="url(#shadow3D)" />

  <!-- Círculos de Resplandor Neón de Fondo -->
  <circle cx="400" cy="380" r="240" fill="#10B981" fill-opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="560" cy="260" r="140" fill="#FACC15" fill-opacity="0.06" filter="url(#neonGlow)" />

  <!-- Gráfica de Tendencia Alcista de Fondo -->
  <g opacity="0.25">
    <path d="M160 520 L 260 470 L 360 490 L 460 380 L 560 330 L 640 230" 
          fill="none" stroke="url(#chartGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="260" cy="470" r="6" fill="#10B981" />
    <circle cx="360" cy="490" r="6" fill="#10B981" />
    <circle cx="460" cy="380" r="8" fill="#34D399" />
    <circle cx="560" cy="330" r="8" fill="#FACC15" />
    <circle cx="640" cy="230" r="10" fill="#FACC15" filter="url(#neonGlow)" />
  </g>

  <!-- Flecha Ascendente Neón -->
  <path d="M590 230 L 640 230 L 640 280" fill="none" stroke="#FACC15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Símbolo Central del Dólar 3D -->
  <text x="404" y="474" 
        font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" 
        font-size="340" 
        font-weight="900" 
        fill="#022c22" 
        text-anchor="middle" 
        letter-spacing="-10">
    $
  </text>
  
  <text x="400" y="465" 
        font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" 
        font-size="340" 
        font-weight="900" 
        fill="url(#dollarGrad)" 
        stroke="#A7F3D0" 
        stroke-width="5" 
        stroke-linejoin="round"
        text-anchor="middle" 
        letter-spacing="-10"
        filter="url(#neonGlow)">
    $
  </text>

  <!-- Cinta Tricolor de Colombia -->
  <g transform="translate(250, 565)">
    <rect x="0" y="0" width="300" height="7" rx="3.5" fill="#FACC15" filter="url(#neonGlow)" />
    <rect x="0" y="9" width="300" height="5" rx="2.5" fill="#2563EB" />
    <rect x="0" y="16" width="300" height="5" rx="2.5" fill="#EF4444" />
  </g>

  <!-- Tipografía: DÓLAR APPZPLAY -->
  <text x="400" y="640" 
        font-family="'Montserrat', 'Arial Black', system-ui, sans-serif" 
        font-size="46" 
        font-weight="900" 
        fill="#FFFFFF" 
        letter-spacing="5" 
        text-anchor="middle"
        filter="url(#shadow3D)">
    DÓLAR APPZPLAY
  </text>

  <!-- Subtítulo: TRM COLOMBIA EN VIVO -->
  <g transform="translate(260, 665)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="140" y="20" 
          font-family="system-ui, sans-serif" 
          font-size="14" 
          font-weight="800" 
          fill="#34D399" 
          letter-spacing="3" 
          text-anchor="middle">
      TRM OFICIAL • EN VIVO
    </text>
  </g>
</svg>
